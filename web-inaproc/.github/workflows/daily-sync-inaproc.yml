name: 🚀 Daily Inaproc Data Sync (01:00 WIB)

on:
  schedule:
    # Jam 01:00 WIB = 18:00 UTC (WIB adalah UTC+7)
    - cron: '0 18 * * *'
  workflow_dispatch: # Manual trigger

jobs:
  sync-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔄 Run Inaproc data sync
        run: |
          echo "⏰ Starting data sync at $(date '+%Y-%m-%d %H:%M:%S WIB')"
          python MegaSyncInaproc.py
          echo "✅ Data sync completed at $(date '+%Y-%m-%d %H:%M:%S WIB')"
        env:
          PYTHONUNBUFFERED: 1

      - name: 📝 Check for changes
        id: git-check
        run: |
          if git diff --quiet; then
            echo "status=no-changes" >> $GITHUB_OUTPUT
          else
            echo "status=has-changes" >> $GITHUB_OUTPUT
            echo "Files modified:"
            git diff --name-only
          fi

      - name: 🔧 Configure Git for commit
        if: steps.git-check.outputs.status == 'has-changes'
        run: |
          git config user.name "Inaproc Bot"
          git config user.email "bot@inaproc.agitstudio.cloud"

      - name: 📤 Commit and push updated CSV files
        if: steps.git-check.outputs.status == 'has-changes'
        run: |
          git add filecsv/
          git commit -m "🔄 Auto-sync Inaproc data: $(date '+%Y-%m-%d %H:%M:%S WIB')"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Sync completed successfully
        if: steps.git-check.outputs.status == 'has-changes'
        run: |
          echo "✅ Data successfully synced and pushed to GitHub"
          echo "📊 All CSV files in filecsv/ are now up-to-date"

      - name: ℹ️ No changes detected
        if: steps.git-check.outputs.status == 'no-changes'
        run: |
          echo "ℹ️ No changes detected - data is already up-to-date"

      - name: ❌ Workflow failed
        if: failure()
        run: |
          echo "❌ Data sync failed!"
          echo "📋 Check workflow logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1