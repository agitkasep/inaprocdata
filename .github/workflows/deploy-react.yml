name: 📱 Deploy React Vite to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web-inaproc/**'
      - '.github/workflows/deploy-react.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'web-inaproc/package-lock.json'

      - name: 📦 Install dependencies
        working-directory: web-inaproc
        run: npm ci

      - name: 🔨 Build project
        working-directory: web-inaproc
        run: npm run build

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web-inaproc/dist
          cname: inaprocdata.agitstudio.cloud
          user_name: 'Inaproc Bot'
          user_email: 'bot@inaproc.agitstudio.cloud'